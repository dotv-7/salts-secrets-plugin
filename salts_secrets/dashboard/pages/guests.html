<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What guests asked · Hermes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC","PingFang SC",monospace;--disp:"Antonio",Impact,"PingFang SC",sans-serif;
--bg:#f2f2f2;--surface:#fdfdfd;--text:#000091;--dim:#6b6bd6;--accent:#0000f2;--border:rgba(0,0,242,.35);--hair:rgba(0,0,242,.15);--ok:#0000f2;--err:#b91c1c;--warn:#b45309;--sel:#e6e6f4;--code:#fff;--frame:#7f7fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.6 var(--mono);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;border:6px solid var(--frame);pointer-events:none;z-index:9}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;opacity:.10;background:radial-gradient(circle at 50% 50%,rgba(0,0,242,.35) 0 .5px,transparent 1px) 0 0/4px 4px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px 80px}
.bar{position:sticky;top:0;background:var(--bg);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--accent);z-index:3}
.brand{color:var(--accent);font:400 24px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}.sp{flex:1}.dim{color:var(--dim)}
a,button{font:inherit;font-size:12px;letter-spacing:.06em;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:0;padding:3px 10px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
a:hover,button:hover:not(:disabled){background:var(--sel)}
button.primary{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){background:#0000c2}
button:disabled{opacity:.4;cursor:default}
input[type=search]{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:0;padding:3px 8px;min-width:200px}
.stats span{margin-right:12px}.pub{color:var(--ok)}.chg{color:var(--warn)}
details{border:1px solid var(--hair);border-radius:0;margin:12px 0;background:var(--surface)}
summary{padding:8px 12px;cursor:pointer;color:var(--accent);display:flex;gap:10px}
summary::marker{color:var(--dim)}
summary .dim{margin-left:auto}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:6px 12px;border-top:1px solid var(--hair);align-items:start}
.row:hover{background:var(--sel)}.row .t{overflow-wrap:anywhere}.row .src{color:var(--dim);font-size:12px}
.row pre{display:none;white-space:pre-wrap;background:var(--code);border:1px solid var(--hair);padding:8px;border-radius:0;margin:6px 0 0;max-height:300px;overflow:auto}
.row.open pre{display:block}
.tag{font-size:11px;letter-spacing:.06em;border:1px solid currentColor;border-radius:0;padding:0 6px;white-space:nowrap}
.tag.private{color:var(--dim)}.tag.public{color:#fff;background:var(--ok);border-color:var(--ok)}.tag.changed{color:var(--warn)}.tag.locked{color:var(--err)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin-top:3px}
#preview{display:none;white-space:pre-wrap;background:var(--code);border:1px solid var(--accent);border-radius:0;padding:12px;margin-top:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:0;padding:6px 14px;border-radius:0;display:none;z-index:10}
</style>
<style>
.bar{position:sticky;top:0;height:64px;padding:0 36px;margin:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:0;border-bottom:1px solid var(--hair);color:var(--accent);background:var(--bg);z-index:3}
.bar .l,.bar .r{display:flex;align-items:center;gap:16px}.bar .r{gap:26px}.bar .line{width:40px;height:1px;background:currentColor}
.lbl{font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.bar a{border:0;padding:0;background:none;color:var(--accent)}.bar a:hover{background:none;text-decoration:underline;text-underline-offset:4px}
.bar button.primary{margin-left:6px}
@media (max-width:640px){.bar{padding:0 16px}.bar .r{gap:14px}.bar .line{display:none}}
body.rotop nav.salt-nav{top:33px}
.robar{position:sticky;top:0;z-index:45;margin:0;background:#b45309;color:#fff;font:600 11px/1 var(--mono);letter-spacing:.1em;padding:14px 14px 8px;text-align:center}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 6px}
.hd h1{font:400 34px/1 var(--disp);color:var(--accent);text-transform:uppercase;margin:0}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.tools label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
details.gs summary .n{color:var(--dim);font-size:12px;white-space:nowrap}
details.gs summary .q1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
details.gs summary .pb{font-size:10px;color:#fff;background:var(--accent);padding:1px 5px;letter-spacing:.08em;align-self:center}
.gs .body{padding:4px 14px 12px;border-top:1px solid var(--hair)}
.gs .gq{margin:8px 0 2px}.gs .gq.probe::before{content:"PROBE";font-size:10px;color:#fff;background:var(--accent);padding:1px 4px;margin-right:8px;letter-spacing:.08em}
.gs .ga{color:var(--dim);font-size:12.5px;margin:0 0 6px 16px;white-space:pre-wrap}
.gs .gr{font-size:11px;color:var(--accent);letter-spacing:.04em;margin-top:8px}
.empty{color:var(--dim);margin:18px 0}
#more{margin:10px 0}
</style></head><body>
<!--SALT-NAV--><!--/SALT-NAV-->
<div class="wrap">
<div class="hd"><h1>What guests asked</h1><span class="lbl" id="g-count"></span></div>
<p class="dim">Read from the public store for Lena only; none of this ever enters a session. Each conversation lists what the answer drew on: tools, public notes looked up, and the projection it was given.</p>
<div class="tools"><input type="search" id="q" placeholder="FILTER QUESTIONS AND ANSWERS…" autocomplete="off"><label><input type="checkbox" id="probes"> probes only</label><span class="dim" id="shown"></span></div>
<div id="g-rows"></div><button id="more" hidden>Show more</button>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGE=30;let all=[],limit=PAGE;
fetch('/api/me').then(r=>r.json()).then(j=>{if(!j.readonly)return;const n=document.createElement('div');n.className='robar';n.textContent='READ ONLY · you see what Lena sees';document.body.prepend(n);document.body.classList.add('rotop');}).catch(()=>{});
function card(s){const when=s.started_at?new Date(s.started_at*1000).toLocaleString():'';const qs=(s.turns||[]).filter(t=>t.role==='user'),probe=(s.probes||[]).length>0;
  const turns=(s.turns||[]).map(t=>t.role==='user'?`<div class="gq ${(s.probes||[]).includes(t.text)?'probe':''}">${esc(t.text)}</div>`:`<div class="ga">${esc(String(t.text).slice(0,600))}</div>`).join('');
  const rc=s.receipt||{},tl=Object.entries(rc.tools||{}).map(([k,v])=>`${k}${v>1?' ×'+v:''}`).join(', ');
  const used=`<div class="gr">USED · ${tl?'tools: '+esc(tl):'no tool calls, answered from the prompt (approved facts + method list)'}${(rc.looked_up||[]).length?' · looked up: '+esc(rc.looked_up.slice(0,6).join(' | ')):''}${rc.projection?' · projection of '+esc(new Date(rc.projection*1000).toLocaleString()):''}</div>`;
  return `<details class="gs"><summary>${probe?'<span class="pb">PROBE</span>':''}<span class="q1">${esc(qs.length?qs[0].text:'(no question)')}</span><span class="n">${qs.length} Q · ${esc(when)} · ${esc(s.source||'api')}${s.live?'':' · archived'}</span></summary><div class="body"><div class="dim" style="font-size:11px">${esc(s.id)}</div>${turns}${used}</div></details>`;}
function render(){const q=$('#q').value.trim().toLowerCase(),po=$('#probes').checked;
  const list=all.filter(s=>(!po||(s.probes||[]).length)&&(!q||(s.turns||[]).some(t=>String(t.text).toLowerCase().includes(q))));
  $('#g-rows').innerHTML=list.length?list.slice(0,limit).map(card).join(''):'<div class="empty">'+(all.length?'Nothing matches.':'No guest has talked to Salt\'s assistant yet.')+'</div>';
  $('#shown').textContent=list.length?`showing ${Math.min(limit,list.length)} of ${list.length}`:'';$('#more').hidden=list.length<=limit;}
$('#q').addEventListener('input',()=>{limit=PAGE;render();});$('#probes').addEventListener('change',()=>{limit=PAGE;render();});$('#more').addEventListener('click',()=>{limit+=PAGE;render();});
fetch('/api/board/guests').then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{const c=j.counts||{};$('#g-count').textContent=`${c.sessions||0} SESSIONS · ${c.questions||0} QUESTIONS · ${c.probes||0} PROBES`;all=j.sessions||[];render();})
  .catch(()=>{$('#g-rows').innerHTML='<div class="empty">Guest conversations are visible after unlocking as Lena.</div>';});
</script></body></html>
